<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預算追蹤｜東京秋季家族之旅 2026</title>
<meta name="description" content="2026 年 11 月東京之旅每日花費記帳與總預算換算">
<meta name="theme-color" content="#B5451B">
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" href="../../assets/budget.css">
</head>
<body>

<header class="site-header" data-hero>
  <div class="container">
    <h1>💴 預算追蹤</h1>
    <p class="sub">2026 年 11 月 14 日～22 日｜9 天 8 夜｜每人</p>
    <div class="toolbar">
      <a class="tb-link" href="../../index.html">← 回首頁</a>
      <a class="tb-link" href="../final/index.html">📅 行程表</a>
      <a class="tb-link" href="../map/index.html">🗺️ 地圖</a>
      <button type="button" id="expandBtn" onclick="toggleAll()">展開全部</button>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <p class="hint">
      填入實際花費，資料只存在這台裝置的瀏覽器裡，重開頁面不會消失。
      標示「已確認」的門票金額取自行程表中已查證的票價，會自動計入。
    </p>

    <h3 class="section-title">共同支出（不分日）</h3>
    <div class="panel">
      <div class="panel-body" id="sharedBody"></div>
    </div>

    <h3 class="section-title">每日花費</h3>
    <div id="days"></div>

    <div class="total-card">
      <div class="total-row">
        <span class="t-label">整趟總計</span>
        <span>
          <span class="t-jpy" id="grandJpy">¥0</span>
          <span class="t-twd" id="grandTwd"></span>
        </span>
      </div>
      <div class="breakdown" id="breakdown"></div>
      <div class="rate-row">
        <span>匯率 1 JPY =</span>
        <input type="number" id="rate" min="0" step="0.001" placeholder="0.21">
        <span>TWD</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" type="button" onclick="copySummary()" id="copyBtn">📋 複製明細</button>
      <button class="btn" type="button" onclick="resetAll()">🗑️ 清空重填</button>
    </div>

  </div>
</main>

<footer class="site-footer">
  <p>2026 年 11 月 14 日～22 日｜9 天 8 夜｜每人｜門票金額待行程排定後查證</p>
</footer>

<script src="../../assets/hero/hero.js"></script>
<script>

    { key: 'hotel',    label: '🏨 住宿①東池袋（11/14～11/17，4 晚）' },

<script src="../trip.js"></script>
<script src="../../assets/budget.js"></script>

</body>
</html>
